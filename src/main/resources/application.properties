# ==============================================================================
# Campus Lost & Found Management System - Application Configuration
# This file is safe to push to GitHub (contains no sensitive credentials)
# ==============================================================================

# Server Port (configurable via environment variable PORT, default 8080)
server.port=${PORT:8080}

# Application Name
spring.application.name=lostfound-backend

# Database Configuration (Overrides can come from env vars or application-local.properties)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lostfound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Automatically update database schema tables to match Java entity models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret Key and Expiration (Default 24 hours = 86400000 ms)
# Secret must be at least 256 bits (32 bytes) for HMAC-SHA256
jwt.secret=${JWT_SECRET:CampusLostAndFoundSecretKey2026SecureMustBe32BytesLongForHS256!}
jwt.expiration-ms=86400000

# Allowed CORS origins (comma-separated if multiple, default: Vite dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# File Upload Configuration (multipart storage for item photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# Local development override file (ignored in git)
spring.config.import=optional:classpath:application-local.properties
